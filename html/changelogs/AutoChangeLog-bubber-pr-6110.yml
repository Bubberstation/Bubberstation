author: "StrangeWeirdKitten"
delete-after: True
changes:
  - balance: "Houndeye melee damage 15 -> 1. The mob never used it unless player controlled, and its blast is now an ability that player controlled houndeyes can also use."
  - bugfix: "headcrabs no longer damage eachother when leaping"
  - bugfix: "player controlled headcrabs now transfer control into the zombie upon zombification"
  - bugfix: "Player controlled houndeyes and headcrabs now have full control over the blast and jump abilities"