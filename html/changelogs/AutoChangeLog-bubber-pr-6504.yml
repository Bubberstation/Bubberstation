author: "SapphoQueer"
delete-after: True
changes:
  - rscadd: "Synthetic Chicken, Eggs, and cornmeal are now printable through the biogenerator."
  - rscadd: "Coco powder and Caramel are now available through the soda dispenser's tier 3 and tier 4 upgrades respectively."
  - rscadd: "The rapid light dispenser is now available through the engineering and service lathes after the construction techweb has been researched."
  - rscadd: "The frontier/colonial clothing is now within the appropriate vendors, most of it through the clothesvend, the medical stuff through the medical's, and the armored stuff through security's."
  - rscadd: "The wallmounted heaters and multi-chargers are now available through the appropriate techwebs."
  - rscadd: "The medipen pouch is now available through the premium tab of the medivend."
  - rscadd: "Cargo can print a frontier disk which will allow the autolathe to print the frontier tools once experimental tools has been researched."
  - rscadd: "Soup pots are once again available in the autolathe"