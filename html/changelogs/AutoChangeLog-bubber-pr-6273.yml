author: "NanoCats"
delete-after: True
changes:
  - rscadd: "Rapid Construction Fabricators can now be opened and hacked to access autolathe contraband designs."
  - rscadd: "The Rapid Construction Fabricator has an internal battery, so it can print without station power."
  - rscadd: "Planetary Ore Thumpers have a very small chance of causing an earthquake while fracking."
  - rscadd: "Restored soup pots to the Rapid Construction Fabricator."
  - rscadd: "Added the field multitool and GAGS for colony tools"
  - balance: "The Rapid Construction Fabricator costs more, its tools are slower, and its design list was trimmed"
  - bugfix: "Fixed colony wind turbines and Stirling generators to work correctly with the current power system"
  - bugfix: "Fixed deployable colony solar panel overlays"
  - bugfix: "Made ore thumpers work as intended and improved Ore Thumper usability"
  - bugfix: "The colony recycler no longer eats things it shouldn't"
  - bugfix: "Fixed infinite biomass from the Colonial Supply Core"
  - qol: "DeForest bioregenerator stackables now print a full stack instead of a single item."
  - image: "Updated colony gear sprites"