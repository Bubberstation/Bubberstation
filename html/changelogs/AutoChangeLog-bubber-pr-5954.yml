author: "Dr-arielpro"
delete-after: True
changes:
  - rscadd: "Added all four basic damage type medkits to the security medic's locker, along with a basic robotics repair kit."
  - rscadd: "Added a formaldehyde bottle to the security medic's locker, along with restraints."
  - rscadd: "Added a brand new unique handheld crew monitor to the security medic, which is only able to see any security related job. They start with it in their bag."
  - balance: "Basically buffs Security Medic's medical role, to hopefully make them more focused on the medical aspect of their job and less reliant on spending half an hour setting up."
  - image: "Updated the Security Medic closet, at long last."
  - map: "Revamped all infirmaries in Security, giving them proper gear. This includes a basic surgical setup (operating table, surgery computer and surgery tray), a defib mount (without a defib), and a DeForest first aid station. Certain infirmaries might be better equipped due to size."
  - config: "Automapper config for Security Medic closets changed, no longer automatically spawns closets for all maps that received a revamped infirmary."