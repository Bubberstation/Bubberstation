changes:
  - rscadd: "Every departmental guard now spawns with their own HUDsunglasses. Solving the parity issue of Engineering and science guards previously having no eyewear at all."
  - rscadd: "The Captain now wears executive HUDsunglasses, a new steal objective."
  - rscadd: "Customs agents can appraise cargo and flag contraband and undeclared firearms in containers."
  - rscdel: "Removed the permit HUDsunglasses."
  - image: "New sprites for the HUDsunglasses line."
  - bugfix: "The Automatic Appraisal NIFSoft no longer throws a runtime when its owner is deleted."