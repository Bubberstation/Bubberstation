changes:
  - rscadd: "Woodstock shotguns can now be bought for the security armory in packs of 3"
  - balance: "Instead of two renosters and two lesslethal renosters, the armory now spawns three woodstocks and two lesslethal renosters"
  - balance: "Adjusted shotgun single-pack order prices (double-barrel 1000cr > 700cr, woodstock 1200cr > 1000cr, renoster 1400cr > 1800cr). The three-packs are priced similarly."
  - balance: "The shotgun ammobelt and ammopouch have been moved into their own cargo orders at 100cr"