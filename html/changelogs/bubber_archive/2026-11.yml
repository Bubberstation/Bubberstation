2026-11-01:
  ArrisFairburne:
  - qol: Ghost Cafe visitors now get the Return spell to disappear from the cafe from
      anywhere
  - qol: Ghost Cafe visitors now get TRAIT_NO_HUNGER, preventing the hunger message
      from showing up randomly.
  - qol: Ghost Cafe visitors now get qdel'd instead of disintegrated if they leave
      ghost cafe turfs or exit their body, preventing moods based on them from being
      given to others.
  - map: Fixed a bug where the Ghost Cafe captain's bedroom had an error image as
      its floor.
  - qol: The Ghost Cafe areas no longer occupy like 90% of the total ghost teleport
      POIs; only the arrival shuttle appears for ghosts.
  - bugfix: fixed a bug where the sec airlocks would change colors upon destruction
  thegrb93:
  - bugfix: Fix the air in alleyway and fastfood condos
