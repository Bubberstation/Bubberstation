2026-11-04:
  SapphoQueer:
  - rscadd: Gibtonite now can be sold through the cargo shuttle, giving a larger sum
      of credits depending on how close it was to detonating.
  Swan:
  - rscadd: The telepathy quirk now gives out a balloon alert if the telepathy mutation
