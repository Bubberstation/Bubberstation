  - rscadd: Added raw shrimp, fried (cooked) shrimp, and the ability to process fried
      shrimp into shrimp chips.
  - rscdel: Removed the hemphage specific quirks Masquerade, Sol Weakness, and Pseudo-Respiration.
      They are now toggles on the hemophage quirk.
  - refactor: 'Refactored the hemophage species into being a quirk: Hemophagia.'
