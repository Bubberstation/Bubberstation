2026-08-01:
  NanoCats:
  - bugfix: Certain items no longer render a doubled ghost copy in your hand slot.
  StrangeWeirdKitten:
  - balance: increased Protean low power mode walking speed from a modifier of 5 to
      3 (our current walking speed)
  - bugfix: Proteans should no longer get duplicate items when certain outfits are
      equipped.
  Swan:
  - qol: Renames the "mutant body colors" pref to just "body colors", moves most genital
      appearance settings to the visuals tab of the character creator
  ibexgoetia:
  - balance: Being dusted via Dusting Sickness now makes you drop your equipment.
  - bugfix: Abductors and Plasmamen are now blacklisted from picking the Dusting Sickness
      quirk.
