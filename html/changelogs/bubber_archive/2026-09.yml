2026-09-03:
  ArrisFairburne:
  - rscadd: Replaces the synth charging cord with the synth interfacing tool; this
      tool has all existing functionality for the cord, but also functions as a standin
      for PDA click-object functions (ex. taking photos with the camera app)
  - rscadd: 'Restores features unintentionally removed by PR #5527 (restores higher
      disk space on synth PDAs and automatic job app downloads)'
  - qol: Removes automatic PDA imprinting so that every synth on the station no longer
      manages two PDAs chat logs, if they only wanted their handheld's
  - balance: Increases the number of active programs that brain PDAs can run (5, up
      from 3)
